[package]
name = "web-search"
version = "0.6.0"
edition = "2021"
rust-version = "1.96"
description = "A multi-provider web search aggregator with reranking support"
license = "Unlicense"
repository = "https://github.com/link-assistant/web-search"
keywords = ["web-search", "search-engine", "google", "duckduckgo", "bing"]
categories = ["web-programming", "api-bindings"]
readme = "README.md"

[lib]
name = "web_search"
path = "src/lib.rs"

[[bin]]
name = "web-search"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
tokio = { version = "1.53.2", features = ["full"], optional = true }
reqwest = { version = "0.13.5", features = ["form", "json"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", optional = true }
scraper = { version = "0.27.0", optional = true }
regex = { version = "1.13.1", optional = true }
thiserror = { version = "2.0.21", optional = true }
async-trait = { version = "0.1.92", optional = true }
futures = { version = "0.3.34", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.7.1", features = ["cors"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
url = { version = "2.5.8", default-features = false }
urlencoding = { version = "2.1.3", optional = true }
web-capture = { version = "0.4.0", default-features = false, features = ["search"], optional = true }

[dev-dependencies]
tokio-test = "0.4.6"
wiremock = "0.6.5"

[features]
default = ["server"]
# Pure merging and provider discovery also remain available without features.
merge = []
server = [
    "dep:async-trait",
    "dep:axum",
    "dep:clap",
    "dep:futures",
    "dep:regex",
    "dep:reqwest",
    "dep:scraper",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:urlencoding",
    "dep:web-capture",
]

# Lints — adopt the safe baseline from the link-foundation Rust pipeline template.
# `unsafe_code = "forbid"` matches the existing 100% safe codebase and is enforced
# in CI via `RUSTFLAGS: -Dwarnings` (see .github/workflows/rust.yml).
[lints.rust]
unsafe_code = "forbid"

# Optimized release profile from the Rust pipeline template: smaller, faster binaries
# for the CLI/microservice without affecting debug/test builds.
[profile.release]
lto = true
codegen-units = 1
strip = true
