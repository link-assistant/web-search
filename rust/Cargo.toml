[package]
name = "web-search"
version = "0.5.0"
edition = "2021"
rust-version = "1.96"
description = "A multi-provider web search aggregator with reranking support"
license = "Unlicense"
repository = "https://github.com/link-assistant/web-search"
keywords = ["web-search", "search-engine", "google", "duckduckgo", "bing"]
categories = ["web-programming", "api-bindings"]
readme = "README.md"

[lib]
name = "web_search"
path = "src/lib.rs"

[[bin]]
name = "web-search"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
tokio = { version = "1.52", features = ["full"], optional = true }
reqwest = { version = "0.13", features = ["form", "json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
scraper = { version = "0.27", optional = true }
regex = { version = "1", optional = true }
thiserror = { version = "2.0", optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
url = "2.5"
urlencoding = { version = "2.1", optional = true }
web-capture = { version = "0.3.31", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[features]
default = ["server"]
server = [
    "dep:async-trait",
    "dep:axum",
    "dep:clap",
    "dep:futures",
    "dep:regex",
    "dep:reqwest",
    "dep:scraper",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:urlencoding",
    "dep:web-capture",
]

# Lints — adopt the safe baseline from the link-foundation Rust pipeline template.
# `unsafe_code = "forbid"` matches the existing 100% safe codebase and is enforced
# in CI via `RUSTFLAGS: -Dwarnings` (see .github/workflows/rust.yml).
[lints.rust]
unsafe_code = "forbid"

# Optimized release profile from the Rust pipeline template: smaller, faster binaries
# for the CLI/microservice without affecting debug/test builds.
[profile.release]
lto = true
codegen-units = 1
strip = true
