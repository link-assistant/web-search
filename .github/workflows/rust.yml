name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/parity.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/parity.yml'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  detect-changes:
    name: Detect Rust Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
      rust-scripts-changed: ${{ steps.changes.outputs.rust-scripts-changed }}
      rust-workflow-changed: ${{ steps.changes.outputs.rust-workflow-changed }}
      rust-code-changed: ${{ steps.changes.outputs.rust-code-changed }}
      any-rust-code-changed: ${{ steps.changes.outputs.any-rust-code-changed }}
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: rust-script rust/scripts/detect-code-changes.rs --rust-root rust

  version-check:
    name: Version Modification Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script rust/scripts/check-version-modification.rs --rust-root rust

  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-rust-code-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script rust/scripts/check-changelog-fragment.rs --rust-root rust

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.rust-scripts-changed == 'true' ||
        needs.detect-changes.outputs.rust-workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install rust-script
        run: cargo install rust-script

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features

      - name: Check Rust file size
        run: rust-script rust/scripts/check-file-size.rs --rust-root rust

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [detect-changes, changelog]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          needs.detect-changes.outputs.any-rust-code-changed == 'true' &&
          (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: rust
        run: cargo test --all-features --verbose

      - name: Run doc tests
        working-directory: rust
        run: cargo test --doc --verbose

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    if: always() && !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        working-directory: rust
        run: cargo build --release --verbose

      - name: Check package file list
        working-directory: rust
        run: cargo package --list --allow-dirty

      - name: Check crate package size
        run: rust-script rust/scripts/check-crate-size.rs --rust-root rust

  release:
    name: Rust - Publish and Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success'
    permissions:
      contents: write
    outputs:
      crate-published: ${{ steps.publish.outputs.crate_published }}
      crate-version: ${{ steps.version.outputs.version }}
      release-tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read crate version
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read crate version from rust/Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=rust-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check crates.io version
        id: crate
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if curl -fsS "https://crates.io/api/v1/crates/web-search/$VERSION" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "web-search $VERSION is already published on crates.io"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "web-search $VERSION is not published on crates.io yet"
          fi

      - name: Publish crate
        if: steps.crate.outputs.published == 'false'
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required to publish the Rust crate"
            exit 1
          fi

          cargo publish --manifest-path rust/Cargo.toml

          VERSION="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 20); do
            if curl -fsS "https://crates.io/api/v1/crates/web-search/$VERSION" >/dev/null; then
              echo "crate_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for web-search $VERSION to appear on crates.io (attempt $attempt/20)"
            sleep 15
          done

          echo "::error::Published crate did not become visible on crates.io"
          exit 1

      - name: Mark existing crate version
        if: steps.crate.outputs.published == 'true'
        id: already_published
        run: echo "crate_published=false" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            --title "Rust web-search $VERSION" \
            --target "$GITHUB_SHA" \
            --notes "Rust crate release for web-search $VERSION. Crate: https://crates.io/crates/web-search/$VERSION"
