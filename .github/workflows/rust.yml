name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/parity.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/parity.yml'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  detect-changes:
    name: Detect Rust Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
      rust-scripts-changed: ${{ steps.changes.outputs.rust-scripts-changed }}
      rust-workflow-changed: ${{ steps.changes.outputs.rust-workflow-changed }}
      rust-code-changed: ${{ steps.changes.outputs.rust-code-changed }}
      any-rust-code-changed: ${{ steps.changes.outputs.any-rust-code-changed }}
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: rust-script rust/scripts/detect-code-changes.rs --rust-root rust

  version-check:
    name: Version Modification Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script rust/scripts/check-version-modification.rs --rust-root rust

  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-rust-code-changed == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script rust/scripts/check-changelog-fragment.rs --rust-root rust

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.rust-scripts-changed == 'true' ||
        needs.detect-changes.outputs.rust-workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install rust-script
        run: cargo install rust-script

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check merge-only feature boundary
        working-directory: .
        run: |
          cargo check --manifest-path rust/Cargo.toml --no-default-features --lib --verbose
          rust-script rust/scripts/check-core-feature-boundary.rs --rust-root rust

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features

      - name: Check Rust file size
        run: rust-script rust/scripts/check-file-size.rs --rust-root rust

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [detect-changes, changelog]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          needs.detect-changes.outputs.any-rust-code-changed == 'true' &&
          (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: rust
        run: cargo test --all-features --verbose

      - name: Run doc tests
        working-directory: rust
        run: cargo test --doc --verbose

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    if: always() && !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        working-directory: rust
        run: cargo build --release --verbose

      - name: Check package file list
        working-directory: rust
        run: cargo package --list --allow-dirty

      - name: Check crate package size
        run: rust-script rust/scripts/check-crate-size.rs --rust-root rust

  release:
    name: Rust - Publish and Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success'
    permissions:
      contents: write
    # Support both CARGO_REGISTRY_TOKEN (cargo's native env var) and CARGO_TOKEN
    # (for backwards compatibility / organisation secrets named CARGO_TOKEN).
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
    outputs:
      publish-result: ${{ steps.publish.outputs.publish_result }}
      crate-version: ${{ steps.version.outputs.version }}
      release-tag: ${{ steps.version.outputs.tag }}
    steps:
      # Full history so the auto-bump step can fast-forward to the latest main
      # and push the version commit back without a shallow-clone push rejection.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: cargo install rust-script

      # Auto-bump the crate version from changelog.d fragments (issue #17).
      #
      # ROOT CAUSE this fixes: the Rust release job had NO version-bump step, so
      # the crate version never advanced past its initial value. Fragments piled
      # up in changelog.d/ unconsumed, check-version-modification.rs forbade
      # editing the version by hand in PRs, and so no new crates.io or GitHub
      # release was ever produced — the "I don't see all the releases" symptom.
      #
      # This mirrors the JavaScript changeset flow and the link-foundation rust
      # pipeline template: fragments declare patch|minor|major and the highest
      # wins. It runs ONLY on real pushes to main (guarded by the job-level `if`),
      # never on pull requests, so it never trips check-version-modification.rs
      # (which only runs on pull_request events).
      #
      # Concurrency safety: rust.yml serialises main runs (cancel-in-progress is
      # false on main), but a run may still have been triggered from a SHA that is
      # now behind. The step therefore hard-resets to the freshest origin/main
      # BEFORE deciding whether to bump, so fragments already consumed by an
      # earlier run are seen as gone (has_fragments=false) and we no-op instead of
      # double-bumping. Everything downstream (version read, publish, release)
      # then operates on this up-to-date, possibly-bumped tree.
      - name: Auto-bump version from changelog fragments
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-align to the newest main so concurrent releases don't double-bump.
          git fetch origin main
          git checkout -B main origin/main

          # Run once and parse both outputs from the captured stdout (compiling
          # rust-script twice just to read a second value is wasteful).
          BUMP_OUT=$(rust-script rust/scripts/get-bump-type.rs --rust-root rust)
          echo "$BUMP_OUT"
          HAS_FRAGMENTS=$(printf '%s\n' "$BUMP_OUT" | sed -n 's/^Output: has_fragments=//p')
          BUMP_TYPE=$(printf '%s\n' "$BUMP_OUT" | sed -n 's/^Output: bump_type=//p')

          if [ "$HAS_FRAGMENTS" != "true" ]; then
            echo "No changelog fragments — version already final; skipping bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Applying $BUMP_TYPE bump from changelog fragments"
          rust-script rust/scripts/bump-version.rs --bump-type "$BUMP_TYPE" --rust-root rust
          rust-script rust/scripts/collect-changelog.rs --rust-root rust

          # Keep Cargo.lock's recorded crate version in step with Cargo.toml.
          # `-p <name>` limits the update to the local package (1 entry), leaving
          # every pinned dependency untouched; `|| true` keeps a transient
          # registry-index hiccup from failing the release (the lockfile version
          # is not load-bearing for the un-`--locked` build/test jobs).
          NAME=$(sed -n 's/^name = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          (cd rust && cargo update -p "$NAME") || true

          git add rust/Cargo.toml rust/Cargo.lock rust/CHANGELOG.md rust/changelog.d
          NEW_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          git commit -m "rust-$NEW_VERSION"
          git push origin main

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION and pushed to main"

      - name: Read crate version
        id: version
        run: |
          # Single-language vs multi-language auto-detection: a Cargo.toml at the
          # repo root means the crate IS the repository (single-language); a
          # crate under rust/ means the repo hosts multiple languages and the
          # GitHub Releases list is shared, so releases must be namespaced.
          if [ -f Cargo.toml ]; then
            RUST_ROOT="."
            MULTI_LANG=false
          else
            RUST_ROOT="rust"
            MULTI_LANG=true
          fi
          CARGO_TOML="$RUST_ROOT/Cargo.toml"

          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "$CARGO_TOML" | head -n 1)
          NAME=$(sed -n 's/^name = "\(.*\)"/\1/p' "$CARGO_TOML" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read crate version from $CARGO_TOML"
            exit 1
          fi
          if [ -z "$NAME" ]; then
            echo "::error::Could not read crate name from $CARGO_TOML"
            exit 1
          fi

          # Tags are deliberately SHORT (issue #17): no `v` prefix, single
          # hyphen separator. Multi-language → namespaced tag `rust-<semver>`;
          # single-language → bare `<semver>` (nothing to disambiguate against).
          if [ "$MULTI_LANG" = "true" ]; then
            TAG="rust-$VERSION"
          else
            TAG="$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "multi_lang=$MULTI_LANG" >> "$GITHUB_OUTPUT"
          echo "Detected layout: multi_lang=$MULTI_LANG, crate=$NAME, version=$VERSION, tag=$TAG"

      # Pre-flight existence check. The Rust release job runs on every push to
      # main that touches rust/**, but the crate version is only bumped in some of
      # those pushes. Skipping an already-published version here keeps no-op
      # re-pushes green instead of letting `cargo publish` fail with
      # "already exists" (a false-positive red build).
      #
      # IMPORTANT: crates.io returns HTTP 403 for requests without a descriptive
      # User-Agent, which previously made EVERY version look "not published" and
      # defeated this skip entirely. Always send a User-Agent header.
      - name: Check crates.io version
        id: crate
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "web-search-release-ci (https://github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/web-search/$VERSION")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "web-search $VERSION is already published on crates.io"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "web-search $VERSION is not published on crates.io yet"
          else
            echo "::error::Unexpected HTTP $HTTP_CODE from crates.io while checking web-search $VERSION"
            exit 1
          fi

      # Publishing is delegated to rust/scripts/publish-crate.rs, which:
      #   - reads the token from CARGO_REGISTRY_TOKEN || CARGO_TOKEN
      #   - classifies failures (already_exists / auth_failed / rate_limited / failed)
      #   - treats a crates.io HTTP 429 rate-limit as a deferred, recoverable
      #     outcome (exit 0) so a transient throttle never turns the build red
      - name: Publish crate
        if: steps.crate.outputs.published == 'false'
        id: publish
        run: rust-script rust/scripts/publish-crate.rs

      - name: Wait for crate to be available on crates.io
        if: steps.crate.outputs.published == 'false' && steps.publish.outputs.publish_result == 'success'
        run: rust-script rust/scripts/wait-for-crate.rs --release-version "${{ steps.version.outputs.version }}"

      # Create the GitHub release whenever the crate is (now or already) on
      # crates.io. The step is idempotent: an existing tag is treated as success.
      - name: Create GitHub Release
        if: |
          steps.crate.outputs.published == 'true' ||
          steps.publish.outputs.publish_result == 'success' ||
          steps.publish.outputs.publish_result == 'already_exists'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NAME="${{ steps.version.outputs.name }}"
          MULTI_LANG="${{ steps.version.outputs.multi_lang }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi

          # Multi-language repos prefix the title with the language so [Rust] and
          # [JavaScript] releases are distinguishable in one shared list.
          if [ "$MULTI_LANG" = "true" ]; then
            TITLE="[Rust] $VERSION"
          else
            TITLE="$NAME $VERSION"
          fi

          # crates.io badge whose link points at THIS version's crate page, so the
          # release leads directly to the matching package-manager release.
          CRATE_URL="https://crates.io/crates/$NAME/$VERSION"
          BADGE="[![crates.io](https://img.shields.io/badge/crates.io-v$VERSION-orange?logo=rust)]($CRATE_URL)"
          NOTES="$(printf '%s\n\nRust crate release for `%s` %s.\n\nInstall with `cargo add %s@%s`. Crate page: %s' \
            "$BADGE" "$NAME" "$VERSION" "$NAME" "$VERSION" "$CRATE_URL")"

          # Target the auto-bump commit when one was made this run, otherwise the
          # triggering commit. This guarantees the tag points at the tree that
          # actually carries the released version.
          TARGET_SHA="${{ steps.bump.outputs.release_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="$GITHUB_SHA"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --target "$TARGET_SHA" \
            --notes "$NOTES"

      # Install-from-package smoke test (issue #6): prove the published crate is
      # actually installable from crates.io and that all three entry points work
      # from a clean install — NOT from the repo checkout:
      #   1. Library — a fresh crate that depends on web-search@VERSION compiles
      #   2. CLI     — `web-search --list-providers` (offline, no network)
      #   3. HTTP    — `web-search serve` boots and answers /health
      - name: Smoke-test published crate
        if: |
          steps.crate.outputs.published == 'true' ||
          steps.publish.outputs.publish_result == 'success' ||
          steps.publish.outputs.publish_result == 'already_exists'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          echo "::group::Install web-search@$VERSION binary from crates.io"
          cargo install web-search --version "$VERSION" --root "$WORK/install" --locked
          BIN="$WORK/install/bin/web-search"
          echo "::endgroup::"

          echo "::group::CLI entry point — web-search --list-providers"
          # Capture the full output FIRST instead of piping the binary straight
          # into `head`. A pipe to `head -n 5` closes the read end after five
          # lines, so the binary gets SIGPIPE on its next write and aborts
          # ("failed printing to stdout: Broken pipe", exit 101). Under
          # `set -o pipefail` that turned a perfectly healthy CLI into a red
          # smoke test — the exact false-positive this change removes. Capturing
          # to a variable severs the pipe; we only paginate the captured text.
          PROVIDERS_OUTPUT="$("$BIN" --list-providers)"
          if [ -z "$PROVIDERS_OUTPUT" ]; then
            echo "::error::CLI --list-providers produced no output"
            exit 1
          fi
          printf '%s\n' "$PROVIDERS_OUTPUT" | head -n 5
          echo "CLI OK"
          echo "::endgroup::"

          echo "::group::HTTP server entry point — web-search serve"
          "$BIN" serve --port 38218 &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:38218/health" >/dev/null 2>&1; then
              echo "server OK: /health responded"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::HTTP server did not answer /health in time"
              kill "$SRV" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          kill "$SRV" 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::Library entry point — dependent crate compiles"
          cargo new --bin "$WORK/lib-consumer" >/dev/null
          cd "$WORK/lib-consumer"
          cargo add web-search@"$VERSION" >/dev/null
          # Unify the duplicated alloc-no-stdlib in the freshly-resolved lock
          # (issue #17). brotli 8.0.3 — pulled transitively via
          # tower-http → async-compression → compression-codecs — requires
          # alloc-no-stdlib ^2, but a fresh resolve also lets brotli-decompressor
          # pull alloc-no-stdlib 3.0.0. With both majors present, `StandardAlloc`
          # from 2.0.4 no longer satisfies brotli's `Allocator` trait bound from
          # 3.0.0, so the consumer fails to compile (E0277). The repo's committed
          # Cargo.lock already pins the single working 2.0.4 line; downstream
          # consumers that resolve fresh hit the split unless they do the same.
          # Collapsing the 3.0.0 instance to 2.0.4 (which brotli accepts) restores
          # a single version. This is a no-op (rc 0) once the duplicate is gone,
          # so it is safe to run unconditionally and future-proof if upstream
          # later aligns the alloc-no-stdlib requirement.
          cargo update -p alloc-no-stdlib@3.0.0 --precise 2.0.4 2>/dev/null || true
          cat > src/main.rs <<'EOF'
          use web_search::WebSearchEngine;

          fn main() {
              // Constructing the engine proves the published library entry point
              // is usable from a downstream crate.
              let _engine = WebSearchEngine::new();
              println!("library OK: WebSearchEngine constructed from web-search crate");
          }
          EOF
          cargo run --quiet
          echo "::endgroup::"

          echo "All entry points verified for web-search@$VERSION"
