name: JavaScript Checks and Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual release support is consolidated here for npm trusted publishing.
  # npm allows one trusted-publisher workflow, so JavaScript package publishing
  # goes through js.yml.
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changeset-pr
      bump_type:
        description: 'Manual release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Manual release description (optional)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

defaults:
  run:
    working-directory: js

jobs:
  detect-changes:
    name: JS - Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      js-code-changed: ${{ steps.changes.outputs.js-code-changed }}
      any-js-code-changed: ${{ steps.changes.outputs.any-js-code-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      js-workflow-changed: ${{ steps.changes.outputs.js-workflow-changed }}
      package-changed: ${{ steps.changes.outputs.package-changed }}
      scripts-changed: ${{ steps.changes.outputs.scripts-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node js/scripts/detect-code-changes.mjs

  version-check:
    name: JS - Check for Manual Version Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version changes in js/package.json
        working-directory: .
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node js/scripts/check-version.mjs --js-root js

  changeset-check:
    name: JS - Check for Changesets
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.js-code-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Check for changesets
        working-directory: .
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.head_ref }}" == "changeset-release/"* ]]; then
            echo "Skipping changeset check for automated release PR"
            exit 0
          fi

          node js/scripts/validate-changeset.mjs --js-root js

  lint:
    name: JS - Lint and Format Check
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-js-code-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "=== Synchronizing PR with latest $BASE_REF ==="
          echo "This prevents stale merge preview issues (see docs/case-studies/issue-23)"
          echo ""

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          echo "Fetching latest $BASE_REF..."
          git fetch origin "$BASE_REF"

          CURRENT_SHA=$(git rev-parse HEAD)
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")

          echo "Current checkout (merge preview): $CURRENT_SHA"
          echo "Latest base branch ($BASE_REF): $BASE_SHA"
          echo ""

          BEHIND_COUNT=$(git rev-list --count HEAD..origin/$BASE_REF)

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Merge preview is up-to-date with $BASE_REF. No simulation needed."
          else
            echo "Base branch has $BEHIND_COUNT new commit(s) since PR was opened/synced."
            echo "Simulating fresh merge to validate actual merge result..."
            echo ""

            if git merge origin/$BASE_REF --no-edit; then
              echo ""
              echo "Fresh merge simulation successful!"
              echo "Checks will now run against the up-to-date merged state."
            else
              echo ""
              echo "::error::Merge conflict detected. PR needs to be rebased/updated before it can be merged."
              echo "The PR branch is out of sync with $BASE_REF and cannot be automatically merged."
              exit 1
            fi
          fi
          echo ""

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check code duplication
        run: npm run check:duplication

  test:
    name: JS - Test (${{ matrix.runtime }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes, changeset-check]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          (needs.changeset-check.result == 'success' || needs.changeset-check.result == 'skipped') &&
          needs.detect-changes.outputs.any-js-code-changed == 'true'
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "=== Synchronizing PR with latest $BASE_REF ==="
          echo "This prevents stale merge preview issues (see docs/case-studies/issue-23)"
          echo ""

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          echo "Fetching latest $BASE_REF..."
          git fetch origin "$BASE_REF"

          CURRENT_SHA=$(git rev-parse HEAD)
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")

          echo "Current checkout (merge preview): $CURRENT_SHA"
          echo "Latest base branch ($BASE_REF): $BASE_SHA"
          echo ""

          BEHIND_COUNT=$(git rev-list --count HEAD..origin/$BASE_REF)

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Merge preview is up-to-date with $BASE_REF. No simulation needed."
          else
            echo "Base branch has $BEHIND_COUNT new commit(s) since PR was opened/synced."
            echo "Simulating fresh merge to validate actual merge result..."
            echo ""

            if git merge origin/$BASE_REF --no-edit; then
              echo ""
              echo "Fresh merge simulation successful!"
              echo "Checks will now run against the up-to-date merged state."
            else
              echo ""
              echo "::error::Merge conflict detected. PR needs to be rebased/updated before it can be merged."
              echo "The PR branch is out of sync with $BASE_REF and cannot be automatically merged."
              exit 1
            fi
          fi
          echo ""

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies (Node.js)
        if: matrix.runtime == 'node'
        run: npm install

      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun test

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests (Deno)
        if: matrix.runtime == 'deno'
        run: deno test --allow-read --allow-env --allow-net

  release:
    name: JS - Release
    needs: [lint, test]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm OIDC trusted publishing requires npm >= 11.5.1, which in turn
          # requires Node >= 22.14.0 (see js/scripts/setup-npm.mjs). Node 24.x
          # matches the link-foundation template baseline.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Update npm for OIDC trusted publishing
        working-directory: .
        run: node js/scripts/setup-npm.mjs

      - name: Check for changesets
        id: check_changesets
        working-directory: .
        run: node js/scripts/check-changesets.mjs --js-root js

      - name: Merge multiple changesets
        if: steps.check_changesets.outputs.has_changesets == 'true' && steps.check_changesets.outputs.changeset_count > 1
        working-directory: .
        run: node js/scripts/merge-changesets.mjs --js-root js

      - name: Version packages and commit to main
        if: steps.check_changesets.outputs.has_changesets == 'true'
        id: version
        working-directory: .
        run: node js/scripts/version-and-commit.mjs --mode changeset --js-root js

      - name: Publish to npm
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        working-directory: .
        # NODE_AUTH_TOKEN is an OPTIONAL bootstrap fallback. When the NPM_TOKEN
        # secret is set, setup-node writes it into .npmrc so the very first
        # publish of a brand-new package (which OIDC trusted publishing cannot
        # bootstrap) succeeds. When the secret is unset the variable is empty and
        # npm falls back to OIDC trusted publishing (id-token: write).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node js/scripts/publish-to-npm.mjs --should-pull --js-root js

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node js/scripts/create-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --js-root js

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node js/scripts/format-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --commit-sha "${{ github.sha }}"

  instant-release:
    name: JS - Instant Release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm OIDC trusted publishing requires npm >= 11.5.1, which in turn
          # requires Node >= 22.14.0 (see js/scripts/setup-npm.mjs). Node 24.x
          # matches the link-foundation template baseline.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Update npm for OIDC trusted publishing
        working-directory: .
        run: node js/scripts/setup-npm.mjs

      - name: Version packages and commit to main
        id: version
        working-directory: .
        run: node js/scripts/version-and-commit.mjs --mode instant --bump-type "${{ github.event.inputs.bump_type }}" --description "${{ github.event.inputs.description }}" --js-root js

      - name: Publish to npm
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        working-directory: .
        # Optional NPM_TOKEN bootstrap fallback; OIDC trusted publishing is used
        # when the secret is unset. See the release job above for details.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node js/scripts/publish-to-npm.mjs --js-root js

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node js/scripts/create-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --js-root js

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node js/scripts/format-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --commit-sha "${{ github.sha }}"

  changeset-pr:
    name: JS - Create Changeset PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changeset-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Create changeset file
        working-directory: .
        run: node js/scripts/create-manual-changeset.mjs --bump-type "${{ github.event.inputs.bump_type }}" --description "${{ github.event.inputs.description }}" --js-root js

      - name: Format changeset with Prettier
        run: npx prettier --write ".changeset/*.md" || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for manual ${{ github.event.inputs.bump_type }} release'
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changeset in this PR
            2. Merge this PR to main
            3. The automated release workflow will create a version PR
            4. Merge the version PR to publish to npm and create a GitHub release
